packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.25'
  - '@better-auth/drizzle-adapter@1.7.25'
  - '@better-auth/expo@1.7.25'
  - '@better-auth/kysely-adapter@1.7.25'
  - '@better-auth/memory-adapter@1.7.25'
  - '@better-auth/mongo-adapter@1.7.25'
  - '@better-auth/prisma-adapter@1.7.25'
  - '@better-auth/telemetry@1.7.25'
  - better-auth@1.7.25
  - i18next@27.1.2

# Install scripts are off unless listed here (pnpm 11). Neither of these is needed yet:
# @sentry/cli only downloads the binary that uploads source maps, which waits for the
# Sentry account (FND-05's EAS half, ADR 0006); @parcel/watcher ships prebuilt binaries
# and its script only compiles a fallback.
allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': false
